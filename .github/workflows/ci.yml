name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run backend unit tests
        working-directory: ./backend
        run: mvn -B test

  e2e-and-jira-report:
    runs-on: ubuntu-latest
    needs: backend-tests
    if: always()
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and start backend
        working-directory: ./backend
        run: |
          mvn -B clean package -DskipTests
          nohup java -jar target/*.jar > backend.log 2>&1 &
          npx wait-on http://localhost:8081/api/events -t 60000 || (echo "--- backend.log ---" && cat backend.log && exit 1)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sentinel
          DB_USER: sentinel
          DB_PASSWORD: sentinel

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build:ci

      - name: Serve frontend
        working-directory: ./frontend
        run: |
          npx http-server dist/sentinel-frontend -p 4200 &
          npx wait-on http://localhost:4200 -t 60000

      - name: Install Cypress + reporter deps
        run: npm install

      - name: Run Cypress tests
        run: npm run cy:run
        continue-on-error: true

      - name: Report failures to JIRA
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: npm run report:jira

      - name: Fail the job if tests failed
        if: always()
        run: |
          if grep -q '"failures": [1-9]' cypress/results/*.json 2>/dev/null; then
            echo "Cypress tests failed — see JIRA for auto-filed bugs."
            exit 1
          fi
